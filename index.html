<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocEase - Gestion Clinique Intelligente</title>
    
    <link rel="manifest" href="./pages/manifest.json">
    <meta name="theme-color" content="#10B981">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./pages/style.css">
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.462.0?external=react",
        "uuid": "https://esm.sh/uuid@11.0.3",
        "recharts": "https://esm.sh/recharts@2.13.3?external=react,react-dom",
        "react-router-dom": "https://esm.sh/react-router-dom@7.1.1?external=react,react-dom"
      }
    }
    </script>
</head>
<body>
    <div id="root">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #666;">
            Chargement de DocEase...
        </div>
    </div>

    <script type="module" src="./pages/index.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./pages/sw.js')
                    .then(reg => console.log('DocEase PWA Active'))
                    .catch(err => console.debug('PWA registration skipped'));
            });
        }
    </script>
</body>
</html>
