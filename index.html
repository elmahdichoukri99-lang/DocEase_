    <script>
        // Service Worker registration with origin check
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // We only register if we are not in a cross-origin preview environment like ai.studio
                const isSameOrigin = window.location.origin === new URL(import.meta?.url || window.location.href).origin;
                
                if (window.location.hostname !== 'ai.studio') {
                  navigator.serviceWorker.register('./sw.js')
                      .then(reg => console.log('DocEase PWA Active:', reg.scope))
                      .catch(err => console.warn('PWA initialization skipped or failed:', err.message));
                } else {
                  console.log('DocEase: Service Worker registration skipped in preview mode.');
                }
            });
        }
    </script>
